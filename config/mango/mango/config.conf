# ~/.config/mango/config.conf
# Converted from Sway — syntax verified against /etc/mango/config.conf

# ─────────────────────────────────────────
# Window Effects
# ─────────────────────────────────────────
blur=0
blur_layer=0
blur_optimized=1
shadows=0
shadow_only_floating=1
border_radius=0
no_radius_when_single=0
focused_opacity=1.0
unfocused_opacity=1.0

# ─────────────────────────────────────────
# Animations
# ─────────────────────────────────────────
animations=1
layer_animations=1
animation_type_open=slide
animation_type_close=slide
animation_fade_in=1
animation_fade_out=1
tag_animation_direction=1
zoom_initial_ratio=0.3
zoom_end_ratio=0.8
fadein_begin_opacity=0.5
fadeout_begin_opacity=0.8
animation_duration_move=500
animation_duration_open=400
animation_duration_tag=350
animation_duration_close=800
animation_duration_focus=0
animation_curve_open=0.46,1.0,0.29,1
animation_curve_move=0.46,1.0,0.29,1
animation_curve_tag=0.46,1.0,0.29,1
animation_curve_close=0.08,0.92,0,1
animation_curve_focus=0.46,1.0,0.29,1
animation_curve_opafadeout=0.5,0.5,0.5,0.5
animation_curve_opafadein=0.46,1.0,0.29,1

# ─────────────────────────────────────────
# Master-Stack Layout
# ─────────────────────────────────────────
new_is_master=1
default_mfact=0.55
default_nmaster=1
# smart_gaps on (from Sway)
smartgaps=1

# ─────────────────────────────────────────
# Overview
# ─────────────────────────────────────────
hotarea_size=10
enable_hotarea=1
ov_tab_mode=0
overviewgappi=5
overviewgappo=30

# ─────────────────────────────────────────
# Misc
# ─────────────────────────────────────────
# smart_borders on (from Sway)
no_border_when_single=1
axis_bind_apply_timeout=100
focus_on_activate=1
idleinhibit_ignore_visible=0
# focus_follows_mouse yes (from Sway)
sloppyfocus=1
warpcursor=1
focus_cross_monitor=0
focus_cross_tag=0
enable_floating_snap=0
snap_distance=30
cursor_size=24
drag_tile_to_tile=1
# hide cursor after 3 seconds (replaces Sway unclutter)
cursor_hide_timeout=3

# ─────────────────────────────────────────
# Keyboard (from Sway input type:keyboard)
# ─────────────────────────────────────────
repeat_delay=200
repeat_rate=50
# xkb_numlock enabled (from Sway)
numlockon=1
xkb_rules_layout=us

# ─────────────────────────────────────────
# Touchpad (from Sway input "ELAN050B" block)
# ─────────────────────────────────────────
disable_trackpad=0
tap_to_click=1
tap_and_drag=1
drag_lock=1
# natural_scroll enabled (from Sway)
trackpad_natural_scrolling=1
disable_while_typing=1
left_handed=0
middle_button_emulation=0
swipe_min_threshold=1
# adaptive accel (from Sway accel_profile adaptive / pointer_accel 0.0)
accel_profile=2
accel_speed=0.0

# ─────────────────────────────────────────
# Appearance (from Sway gaps/borders/colors)
# ─────────────────────────────────────────
# gaps inner 20 / gaps outer 10 (from Sway)
gappih=20
gappiv=20
gappoh=10
gappov=10
scratchpad_width_ratio=0.8
scratchpad_height_ratio=0.9
# default_border pixel 7 (from Sway)
borderpx=7
rootcolor=0x201b14ff
bordercolor=0x444444ff
# client.focused #6f00ff (from Sway)
focuscolor=0x6f00ffff
#unfocuscolor=0x222222ff
maximizescreencolor=0x89aa61ff
urgentcolor=0xad401fff
scratchpadcolor=0x516c93ff
globalcolor=0xb153a7ff
overlaycolor=0x14a57cff

# ─────────────────────────────────────────
# Monitor Rules (from Sway output {} blocks)
# ─────────────────────────────────────────
monitorrule=name:eDP-1,width:2560,height:1600,refresh:240,x:0,y:0,scale:1
monitorrule=name:HDMI-A-1,width:1920,height:1080,refresh:60,x:2560,y:0,scale:1

# ─────────────────────────────────────────
# Tag Rules
# ─────────────────────────────────────────
tagrule=id:1,layout_name:tile
tagrule=id:2,layout_name:tile
tagrule=id:3,layout_name:tile
tagrule=id:4,layout_name:tile
tagrule=id:5,layout_name:tile
tagrule=id:6,layout_name:tile
tagrule=id:7,layout_name:tile
tagrule=id:8,layout_name:tile
tagrule=id:9,layout_name:tile

# ─────────────────────────────────────────
# Window Rules (from Sway for_window blocks)
# ─────────────────────────────────────────
windowrule=isfloating:1,appid:rofi
windowrule=isfloating:1,appid:zoom
windowrule=isfloating:1,appid:pavucontrol
windowrule=isfloating:1,title:Picture-in-Picture
#windowrule=pin:1,title:Picture-in-Picture

# ─────────────────────────────────────────
# Layer Rules
# ─────────────────────────────────────────
layerrule=animation_type_open:zoom,layer_name:rofi
layerrule=animation_type_close:zoom,layer_name:rofi

# ─────────────────────────────────────────
# Environment Variables
# ─────────────────────────────────────────
env=XDG_CURRENT_DESKTOP,mango
env=XDG_SESSION_TYPE,wayland
env=QT_QPA_PLATFORM,wayland
env=ELECTRON_OZONE_PLATFORM_HINT,auto

# ─────────────────────────────────────────
# Autostart (from Sway exec blocks)
# ─────────────────────────────────────────
exec-once=new-wallpaper
exec-once=dunst
exec-once=nm-applet --indicator
exec-once=blueman-applet
exec-once=/usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once=udiskie
exec-once=wl-paste --type text --watch cliphist store
exec-once=wl-paste --type image --watch cliphist store
exec-once=swayidle -w timeout 300 'swaylock -f' timeout 600 'mmsg dpms off' resume 'mmsg dpms on' before-sleep 'swaylock -f'
exec-once=timedatectl set-local-rtc 1 --adjust-system-clock
exec-once=dex --autostart --environment mango
exec-once=/usr/lib/xdg-desktop-portal-wlr

# ─────────────────────────────────────────
# Key Bindings
# mod key names: super,ctrl,alt,shift,none
# combine mods with +  e.g. SUPER+SHIFT
# ─────────────────────────────────────────

# Reload config
bind=SUPER+SHIFT,c,reload_config

# Terminal (kitty)
bind=SUPER,q,spawn,kitty

# Fallback terminal (xterm)
bind=SUPER+SHIFT,q,spawn,xterm

# Kill focused window
bind=SUPER,c,killclient,

# App launcher
bind=SUPER,d,spawn,rofi -show drun

# Lock screen
bind=SUPER,l,spawn,swaylock

# Wallpaper
bind=SUPER,g,spawn,new-wallpaper

# Bruh script
bind=SUPER,b,spawn,~/dotfiles/bruh.sh --dunst

# Bluetooth manager (blueman)
bind=SUPER+SHIFT,b,spawn,blueman-manager

# File manager
bind=SUPER,e,spawn,~/.local/bin/pcmanfm-dark.sh

# Night mode toggle
bind=SUPER,n,spawn,~/.config/sway/scripts/toggle-night-mode.sh

# Screenshot: area to clipboard + save file
#bind=SUPER+SHIFT,s,spawn,bash -c 'grim -g "$(slurp)" - | wl-copy && wl-paste > ~/Pictures/Screenshots/screenshot-$(date +%Y%m%d-%H%M%S).png'
bind=SUPER+SHIFT,s,spawn,~/.local/bin/screenshot.sh

# Screenshot: area to clipboard only
bind=none,Print,spawn,bash -c 'grim -g "$(slurp)" - | wl-copy'

# Quit Mango
bind=SUPER+SHIFT,e,quit

# Focus movement
bind=SUPER,Left,focusdir,left
bind=SUPER,Right,focusdir,right
bind=SUPER,Up,focusdir,up
bind=SUPER,Down,focusdir,down

# Move/swap windows
bind=SUPER+SHIFT,Left,exchange_client,left
bind=SUPER+SHIFT,Right,exchange_client,right
bind=SUPER+SHIFT,Up,exchange_client,up
bind=SUPER+SHIFT,Down,exchange_client,down

# Fullscreen
bind=SUPER,f,togglefullscreen,

# Floating toggle
bind=SUPER+SHIFT,space,togglefloating,

# Focus mode toggle (tiled ↔ floating)
#bind=SUPER,space,togglefocustype,

# Overview
bind=SUPER,a,toggleoverview,

# Layout: monocle (closest to Sway stacking)
bind=SUPER,s,setlayout,monocle

# Layout: deck (closest to Sway tabbed)
bind=SUPER,w,setlayout,deck

# Resize window with keyboard
bind=SUPER+ALT,Left,resizewin,-50,+0
bind=SUPER+ALT,Right,resizewin,+50,+0
bind=SUPER+ALT,Up,resizewin,+0,-50
bind=SUPER+ALT,Down,resizewin,+0,+50

# Tag switching (Super+1-9)
bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0

# Move window to tag (Super+Shift+1-9)
bind=SUPER+SHIFT,1,tag,1,0
bind=SUPER+SHIFT,2,tag,2,0
bind=SUPER+SHIFT,3,tag,3,0
bind=SUPER+SHIFT,4,tag,4,0
bind=SUPER+SHIFT,5,tag,5,0
bind=SUPER+SHIFT,6,tag,6,0
bind=SUPER+SHIFT,7,tag,7,0
bind=SUPER+SHIFT,8,tag,8,0
bind=SUPER+SHIFT,9,tag,9,0

# Media keys
bind=none,XF86AudioRaiseVolume,spawn,~/.local/bin/volumectl up
bind=none,XF86AudioLowerVolume,spawn,~/.local/bin/volumectl down
bind=none,XF86AudioMute,spawn,~/.local/bin/volumectl toggle-mute
bind=none,XF86AudioMicMute,spawn,~/.local/bin/volumectl -m toggle-mute
bind=none,XF86Launch3,spawn,playerctl play-pause
bind=none,XF86AudioPlay,spawn,playerctl play-pause
bind=none,XF86MonBrightnessUp,spawn,~/.local/bin/lightctl up
bind=none,XF86MonBrightnessDown,spawn,~/.local/bin/lightctl down

# Lid switch
switchbind=lid:on,spawn,mmsg dpms off eDP-1
switchbind=lid:off,spawn,mmsg dpms on eDP-1

# ─────────────────────────────────────────
# Mouse Bindings
# ─────────────────────────────────────────
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize

# ─────────────────────────────────────────
# Axis Bindings (scroll through tags)
# ─────────────────────────────────────────
axisbind=SUPER,UP,viewtoleft_have_client
axisbind=SUPER,DOWN,viewtoright_have_client
